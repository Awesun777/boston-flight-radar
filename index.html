<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOS Flight Radar · Cheapest US trips from Boston</title>
  <meta name="description" content="A daily digest of the 5 cheapest US destinations flying out of Boston over the next 1–3 months — national-park-adjacent and solo-trip-friendly picks first, each with a mini travel guide." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap topbar">
      <div class="topbar-left">
        <span class="brand-badge" title="BOS Flight Radar">✈️</span>
        <div class="brand-name">BOS Flight Radar</div>
      </div>

      <div class="topbar-right">
        <div class="search" id="searchwrap">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
          <input id="search" type="search" placeholder="Search destinations…" autocomplete="off" spellcheck="false" />
        </div>

        <div class="datenav">
          <button id="date-prev" class="datenav-btn" type="button" aria-label="Older day" title="Older day">‹</button>
          <select id="date-nav" class="toolbar-select" aria-label="Jump to a date"></select>
          <button id="date-next" class="datenav-btn" type="button" aria-label="Newer day" title="Newer day">›</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <div id="status" class="status">Loading the radar…</div>
    <div id="feed" class="feed" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span id="footer-meta"></span>
      <span class="footer-sep">·</span>
      <span>Prices are indicative ranges from public fare intelligence, not live quotes — always confirm via the Google Flights link on each card.</span>
      <span class="footer-sep">·</span>
      <span>Generated by the <code>/flight-digest</code> skill</span>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
